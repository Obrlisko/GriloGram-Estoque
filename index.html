/* =========================

========================= */

function whats(nome,id){

    `Olá! Tenho interesse no material ${nome} (${id}) disponível no estoque da GRILOGRAN.`;

    `https://wa.me/${WA}?text=${encodeURIComponent(mensagem)}`;

/* =========================
   ADMIN
========================= */

function admin(){

  const senha = prompt("Senha do painel administrativo:");

  if(senha !== "1234"){
    if(senha !== null){
      alert("Senha incorreta.");
    }
    return;
  }

  catalog.style.display = "none";
  adm.style.display = "block";

  renderAdmin();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

  adm.style.display = "none";
  catalog.style.display = "block";

  window.scrollTo({

  });
}

            `).join("")}

        <select

          ${["Polido","Escovado","Leather"]
            .map(v=>`
              <option ${m.acab===v?"selected":""}>
                ${v}
              </option>
            `).join("")}

        </select>

      </div>


      <div class="adminRow">

        <input
          value="${esc(m.med)}"
          placeholder="Medida"
          onchange="updateField(${i},'med',this.value)">

          placeholder="Área"

        <input
          value="${esc(m.preco)}"

          onchange="updateField(${i},'preco',this.value)">

        <select
          onchange="updateField(${i},'status',this.value)">

          ${["Disponível","Reservado","Vendido"]
            .map(v=>`
              <option ${m.status===v?"selected":""}>
                ${v}
              </option>
            `).join("")}

        </select>

        <button
          class="btn"
          onclick="removeMaterial(${i})">
          Excluir
        </button>

      </div>


      <div class="photoAdmin">

        ${
          m.foto
          ?
          `
          <img src="${esc(m.foto)}">
          `
          :
          `
          <div class="photoEmpty">
            📷
          </div>
          `
        }

        <div>

          <div class="photoBtns">

            <label class="btn">
              Selecionar foto

              <input
                type="file"
                accept="image/*"
                onchange="photoSelected(${i},this)">
            </label>

            ${
              m.foto
              ?
              `
              <button
                class="btn"
                onclick="removePhoto(${i})">

              :

          </div>

          <div class="hint">

          </div>

        </div>

      </div>

    </div>

  `).join("");
}


/* =========================
   ALTERAR DADOS
========================= */

function updateField(index,campo,valor){

  data[index][campo] = valor;

}


function add(){

  data.push({
    id:"GR-"+String(data.length+1).padStart(3,"0"),
    nome:"Novo material",
    tipo:"Exótico",
    esp:"2 cm",
    acab:"Polido",
    med:"",
    area:"",
    qtd:"",
    preco:"",
    status:"Disponível",
    foto:""
  });

  renderAdmin();
}


/* =========================
   FOTO
========================= */

function photoSelected(index,input){

  const file = input.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    data[index].foto = e.target.result;

    renderAdmin();

  };

  reader.readAsDataURL(file);
}


function removePhoto(index){

  data[index].foto = "";

  renderAdmin();

}


/* =========================
   EXCLUSÃO
========================= */

function removeMaterial(index){

  if(
    !confirm(
      `Deseja realmente excluir "${data[index].nome}"?`
    )
  ){
    return;
  }

  data.splice(index,1);

  renderAdmin();
}
